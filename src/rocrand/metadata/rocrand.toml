#
# What the rocrand C headers cannot express. One table per C function, and
# `["*"]` for every function; a key with braces names several. A _64 or _spt
# variant without a table takes its base's. See "Fixing a binding" in the
# generator README; `gen.sh --explain <function>` shows what applies.

format = 1

[rocrand_get_version]
version = "scalar-host"
