[general]
name = "hipfftxt"

[library]
prefix = "hipfft"
opaque_handles = [
  "hipfftHandle",
]
# The enums, constants and types of hipfftXt.h, hipfftMp.h and hiplibxt.h; hipfft.h
# is the hipfft module's, used (and so re-exported) whole.
own_headers = ["hipfft/hipfftXt", "hipfft/hipfftMp", "hipfft/hiplibxt"]
uses = ["hipfft"]
# Every hipfftXt* and hipfftMp* function, as cufftXt's in CUDA Fortran, whatever
# header declares it (hipfft.h declares hipfftXtSetWorkArea).
function_prefixes = ["hipfftXt", "hipfftMp"]

[headers]
# hipfftMp.h (the multi-process API) includes hipfft.h; hipfftXt.h is force-included
# ahead of it (see generator.jl). hipfftMp.h's routines exist only in a hipFFT built
# with HIPFFT_MPI_ENABLE; a bind(C) interface costs nothing until called.
subdir = "hipfft"
file   = "hipfftMp.h"

[clang]
defines = []
extra_include_dirs = []

# hipfort layout: the Doxygen groups the docstrings' \ingroup name (see emit_doxygen_groups).
[doxygen]
# hipfftXt.h opens hipfftXtExecDescriptor in a standalone comment attached to no
# declaration, which libclang never hands us, while the hipfftXtExecDescriptor*
# functions' comments carry `@ingroup hipfftXtExecDescriptor`. Defined here, in the
# module of its members (hipfort_hipfftxt), not in hipfort_hipfft. The title is
# hipfftXt.h's; the brief condenses its description.
groups = [
  { name = "hipfftXtExecDescriptor", title = "Multi-device descriptor execution", brief = "Executes multi-device transforms using hipLibXtDesc descriptors as input and output. In-place transforms require input == output." },
]
