[general]
name = "rocsolver"

[check]
# rocSOLVER returns rocblas_status and has no status enum of its own.
success = "ROCBLAS_STATUS_SUCCESS"
# hipfort layout: the module that defines it, for hipfort_check.
module  = "hipfort_rocblas_enums"

[library]
reexport_enums = ["rocblas"]
prefix = "rocsolver_"
# When a routine taking this handle ends (before any batch count) with an integer
# output, that is the info the kernel writes.
solver_info_handles = ["rocblas_handle"]
own_headers = ["rocsolver", "rocblas"]
opaque_handles = [
  "rocblas_handle",
  "rocsolver_rfinfo",
]
# rocsolver-aliases.h: deprecated aliases of the rocBLAS auxiliary functions,
# which the rocblas module binds.
skip_function_prefixes = [
  "rocsolver_create_handle",
  "rocsolver_destroy_handle",
  "rocsolver_set_stream",
  "rocsolver_get_stream",
  "rocsolver_set_vector",
  "rocsolver_get_vector",
  "rocsolver_set_matrix",
  "rocsolver_get_matrix",
]

[headers]
file = "rocsolver.h"

[clang]
defines = []
extra_include_dirs = []
