# What the hiprand C headers cannot express. One section per C function
# (`_64` and `_v2` variants inherit their base function's section), and
# `["*"]` for every function. See "Fixing a binding" in the generator README.

format = 1

[hiprandGenerateLogNormal]

[hiprandGenerateLongLong]

[hiprandGenerateNormalDouble]

[hiprandGenerateUniform]

[hiprandGetVersion]
version = "scalar-host"
