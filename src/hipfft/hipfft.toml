[general]
name = "hipfft"

[library]
prefix = "hipfft"
opaque_handles = [
  "hipfftHandle",
]
# The hipfftxt module's, as cufftXt's in CUDA Fortran (hipfft.h declares
# hipfftXtSetWorkArea).
skip_function_prefixes = ["hipfftXt", "hipfftMp"]

[headers]
subdir = "hipfft"
file   = "hipfft.h"

[clang]
defines = [
  "HIPFFT_EXPORT=",
  "__HIP_PLATFORM_AMD__=1",
]
extra_include_dirs = []
