#
# What the hipfftw C headers cannot express. One section per C function
# (`_64` and `_v2` variants inherit their base function's section), and
# `["*"]` for every function. See "Fixing a binding" in the generator README.

format = 1

# struct-array:
#   Pointers to an emitted derived type that are arrays, declared `type(T) :: x(*)`:
#   the guru interface's dims (length rank) and howmany_dims (length howmany_rank).

[fftw_plan_guru64_dft]
dims = "struct-array"
howmany_dims = "struct-array"

