#
# What the hip C headers cannot express. One table per C function, and
# `["*"]` for every function; a key with braces names several. A _64 or _spt
# variant without a table takes its base's. See "Fixing a binding" in the
# generator README; `gen.sh --explain <function>` shows what applies.

format = 1
# nullable:
#   Arguments documented as nullable. The module procedures take them OPTIONAL and
#   pass c_null_ptr when absent (an OPTIONAL dummy in a bind(C) interface needs F2018).
# by-value:
#   `void** extra` of the launch entry points: by reference, a variable holding
#   c_null_ptr arrives as its own non-NULL address, so HIP sees both kernelParams
#   and extra set and returns hipErrorInvalidValue. kernelParams stays by reference.
# function-pointer:
#   Kernels the headers declare `const void*`, so callers can pass c_funloc(...).
#   The launch entry points (hipLaunchKernel, ...) keep type(c_ptr) for compatibility.

# hipGraphExecUpdate documents updateResult_out as [in], but it is an output.
